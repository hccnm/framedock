name: 功能建议
description: 描述创作场景、遇到的障碍和希望的改进
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有建议。欢迎先讨论目标与使用场景，再确定实现方式；一个建议聚焦一个问题。
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景与当前障碍
      description: 你在完成什么创作任务？现有方式在哪里遇到了困难？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 希望得到的结果
      description: 描述改进后应如何使用，以及怎样判断它解决了问题。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方式
      description: 可说明当前操作方式、临时解决方案或相关 Issue。
  - type: textarea
    id: proposal
    attributes:
      label: 实现想法与参考
      description: 可附界面草图或参考链接；不确定技术方案也可以提交建议。
